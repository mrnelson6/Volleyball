<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Animal Volleyball</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Installable as an app ("Add to Home Screen"): opens fullscreen, landscape, no browser bars.
         use-credentials: the manifest must be fetched with the beta login, or it 401s. -->
    <link rel="manifest" href="TemplateData/manifest.json" crossorigin="use-credentials">
    <meta name="theme-color" content="#46b9eb">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Volleyball">
    <style>
      /* mobile fullscreen button + the iPhone "add to home screen" tip */
      #vb-fs { position: fixed; top: 10px; right: 10px; z-index: 10; width: 42px; height: 42px; display: none;
               border: none; border-radius: 10px; background: rgba(0,0,0,0.35); color: #fff; font-size: 24px;
               line-height: 42px; padding: 0; touch-action: manipulation; }
      #vb-a2hs { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 10; display: none;
                 max-width: 92%; background: rgba(20,30,40,0.88); color: #fff; font: 15px/1.35 sans-serif;
                 padding: 10px 40px 10px 14px; border-radius: 12px; }
      #vb-a2hs button { position: absolute; top: 4px; right: 6px; background: none; border: none; color: #fff;
                        font-size: 20px; padding: 4px 8px; }
    </style>
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
#if DEVELOPMENT_PLAYER
  <script src="<<<TemplateData/profiler.js>>>"></script>
#endif
    <!-- Umami analytics (self-hosted; dashboard at https://analytics.ttnelson.com). Lives here, not in the
         deployed index.html on marvin - that file is build output and deploy.ps1 overwrites it. -->
    <script defer src="https://analytics.ttnelson.com/s.js" data-website-id="738cf5b3-6a19-4dba-9018-361eae2913db"></script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
#if SHOW_DIAGNOSTICS
        <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
#endif
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
      </div>
    </div>
    <button id="vb-fs" aria-label="Fullscreen">&#x26F6;</button>
    <div id="vb-a2hs">For fullscreen: tap <b>Share</b> then <b>Add to Home Screen</b>, and play from the new icon.
      <button aria-label="Dismiss">&#x2715;</button></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // ---- Mobile fullscreen -------------------------------------------------------------
      // Browsers only allow fullscreen from a tap, so: the first tap on the page goes
      // fullscreen (and locks landscape where the browser allows it — Android), and a small
      // button brings it back after you leave. iPhone Safari has no fullscreen for pages at
      // all, so there we suggest "Add to Home Screen" once — the installed app opens with no
      // browser bars (see the manifest / apple-mobile-web-app-capable tags above).
      function isStandalone() {
        return window.matchMedia('(display-mode: fullscreen)').matches ||
               window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      }
      function fullscreenElement() { return document.fullscreenElement || document.webkitFullscreenElement; }
      function canFullscreen() {
        var el = document.documentElement;
        return !!(el.requestFullscreen || el.webkitRequestFullscreen);
      }
      function goFullscreen() {
        if (fullscreenElement() || isStandalone()) return;
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (!req) return;
        var lock = function () {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
        };
        try {
          var p = req.call(el, { navigationUI: 'hide' });
          if (p && p.then) p.then(lock).catch(function () {}); else lock();
        } catch (e) { }
      }
      function setupMobileFullscreen() {
        if (isStandalone()) return; // already an installed app: nothing to do
        var btn = document.getElementById('vb-fs');
        if (canFullscreen()) {
          var refresh = function () { btn.style.display = fullscreenElement() ? 'none' : 'block'; };
          btn.addEventListener('click', goFullscreen);
          document.addEventListener('fullscreenchange', refresh);
          document.addEventListener('webkitfullscreenchange', refresh);
          refresh();
          // the first tap anywhere goes fullscreen by itself; after that it's the button's job
          var first = function () { document.removeEventListener('pointerup', first, true); goFullscreen(); };
          document.addEventListener('pointerup', first, true);
        } else if (/iPhone|iPod/i.test(navigator.userAgent)) {
          var tip = document.getElementById('vb-a2hs');
          var seen = false;
          try { seen = localStorage.getItem('vb.a2hsTip') === '1'; } catch (e) { }
          if (!seen) {
            tip.style.display = 'block';
            tip.querySelector('button').addEventListener('click', function () {
              tip.style.display = 'none';
              try { localStorage.setItem('vb.a2hsTip', '1'); } catch (e) { }
            });
          }
        }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        setupMobileFullscreen();

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;

#if SHOW_DIAGNOSTICS
        // position the diagnostics icon in the corner on the canvas
        let diagnostics_icon = document.getElementById("diagnostics-icon");
        diagnostics_icon.style.position = "fixed";
        diagnostics_icon.style.bottom = "10px";
        diagnostics_icon.style.right = "0px";
        canvas.after(diagnostics_icon);
#endif

      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "{{{ WIDTH }}}px";
        canvas.style.height = "{{{ HEIGHT }}}px";
      }

#if BACKGROUND_FILENAME
      canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
#if SHOW_DIAGNOSTICS
                document.getElementById("diagnostics-icon").onclick = () => {
                  unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
                };
#endif
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

#if DEVELOPMENT_PLAYER
                var profile = unityProfiler.createButton(unityInstance);
                profile.style.marginLeft = '5px';
                document.querySelector("#unity-build-title").appendChild(profile);

                // Unloading web content from DOM so that browser GC can run can be tricky to get right.
                // This code snippet shows how to correctly implement a Unity content Unload mechanism to a web page.

                // Unloading Unity content enables a web page to reclaim the memory used by Unity, e.g. for
                // the purpose of later loading another Unity content instance on the _same_ web page.

                // When using this functionality, take caution to carefully make sure to clear all JavaScript code,
                // DOM element and event handler references to the old content you may have retained, or
                // otherwise the browser's garbage collector will be unable to reclaim the old page.

                // N.b. Unity content does _not_ need to be manually unloaded when the user is navigating away from
                // the current page to another web page. The browser will take care to clear memory of old visited
                // pages automatically. This functionality is only needed if you want to switch between loading
                // multiple Unity builds on a single web page.
                var quit = document.createElement("button");
                quit.style = "margin-left: 5px; background-color: lightgray; border: none; padding: 5px; cursor: pointer";
                quit.innerHTML = "Unload";
                document.querySelector("#unity-build-title").appendChild(quit);
                quit.onclick = () => {
                  // Quit Unity application execution
                  unityInstance.Quit().then(() => {
                    unityProfiler.shutDown();
                    // Remove DOM elements from the page so GC can run
                    document.querySelector("#unity-container").remove();
                    canvas = null;
                    // Remover script elements from the page so GC can run
                    script.remove();
                    script = null;
                  });
                };
#endif
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
